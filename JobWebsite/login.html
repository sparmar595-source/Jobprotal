<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | CareerConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card auth-grid">
      <div class="auth-sidebar">
        <div class="auth-visual">
          <img src="images/auth-login.svg" alt="Career login illustration" />
        </div>
      </div>
      <div class="auth-form-panel">
        <div class="auth-tabs">
          <a href="login.html" class="auth-tab active">Student</a>
          <a href="login.html" class="auth-tab">Employer</a>
        </div>
        <div class="auth-content">
          <div class="auth-title-block">
            <h1>Welcome back</h1>
            <p>Log in to explore jobs, internships, and career opportunities.</p>
          </div>
          <form class="auth-form">
            <div class="form-group">
              <label for="login-email">Email address</label>
              <input type="email" id="login-email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
              <label for="login-password">Password</label>
              <div class="password-field">
                <input type="password" id="login-password" placeholder="Enter your password" required />
                <button type="button" class="password-toggle" data-target="login-password">Show</button>
              </div>
            </div>
            <div class="form-meta">
              <a href="#">Forgot password?</a>
            </div>
            <button class="button button-primary auth-submit">Login</button>
          </form>
          <div class="social-divider"><span>or continue with</span></div>
          <div class="social-buttons">
            <button type="button" class="social-button">Google</button>
            <button type="button" class="social-button">LinkedIn</button>
          </div>
          <p class="auth-note">Don’t have an account? <a href="registration.html">Create one</a></p>
        </div>
      </div>
    </section>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
